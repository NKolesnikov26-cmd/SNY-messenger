<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SNY - Мессенджер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #2c3e50, #3498db); min-height: 100vh; transition: background 0.3s; }
        
        /* Мобильные стили */
        @media (max-width: 768px) {
            .messenger-container { flex-direction: column !important; }
            .sidebar { width: 100% !important; max-height: 30vh !important; display: none; }
            .sidebar.mobile-open { display: block !important; position: absolute; z-index: 100; width: 100% !important; height: 100% !important; max-height: 100% !important; }
            .chat-area { width: 100% !important; }
            .message-bubble { max-width: 85% !important; }
            .game-board { gap: 5px !important; }
            .game-cell { width: 60px !important; height: 60px !important; font-size: 35px !important; }
            .input-tools { flex-wrap: wrap; }
            .tool-btn { padding: 8px 12px; font-size: 12px; }
            .modal-content { width: 95% !important; margin: 10px; }
            .menu-toggle { display: block !important; }
        }
        
        @media (min-width: 769px) {
            .menu-toggle { display: none; }
            .sidebar { display: block !important; }
        }
        
        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            width: auto;
            color: white;
        }
        
        .theme-default { background: linear-gradient(135deg, #2c3e50, #3498db); }
        .theme-pink { background: linear-gradient(135deg, #7c5a6e, #c9a3b8); }
        .theme-red { background: linear-gradient(135deg, #8b5a5a, #c98a8a); }
        .theme-blue { background: linear-gradient(135deg, #4a6a8b, #8aadc9); }
        .theme-green { background: linear-gradient(135deg, #4a6b5a, #8aad9a); }
        .theme-purple { background: linear-gradient(135deg, #6b4a8b, #a98ac9); }
        .theme-orange { background: linear-gradient(135deg, #8b6a4a, #c9aa8a); }
        
        .screen { display: none; min-height: 100vh; padding: 20px; }
        .screen.active { display: flex; justify-content: center; align-items: center; }
        
        .welcome-card { background: rgba(255,255,255,0.95); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
        .welcome-card h1 { font-size: 42px; margin-bottom: 10px; }
        .tab-buttons { display: flex; gap: 10px; margin: 20px 0; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #f0f0f0; border-radius: 10px; cursor: pointer; font-size: 16px; }
        .tab-btn.active { background: #667eea; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        input, button, textarea { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; }
        button { background: #667eea; color: white; border: none; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
        
        .messenger-container { display: flex; width: 100%; height: 100vh; background: white; overflow: hidden; position: relative; }
        
        .sidebar { width: 320px; background: #f9fafb; border-right: 1px solid #ddd; display: flex; flex-direction: column; overflow-y: auto; }
        
        .user-profile { padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #ddd; cursor: pointer; }
        .profile-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .profile-info { flex: 1; }
        .profile-info h3 { font-size: 16px; }
        .profile-info small { font-size: 10px; color: #666; }
        .copy-id { background: none; border: none; font-size: 18px; cursor: pointer; width: auto; padding: 8px; }
        
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #eee; transition: background 0.2s; }
        .chat-item:active { background: #e0e0e0; }
        .chat-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; font-size: 16px; }
        .chat-last-seen { font-size: 11px; color: #999; }
        .pinned-chat { background: #fef3c7; border-left: 3px solid #f59e0b; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: white; }
        
        .chat-header { padding: 16px; border-bottom: 1px solid #ddd; background: white; display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .chat-header-name { font-weight: 600; font-size: 16px; }
        .chat-header-id { font-size: 11px; color: #666; }
        .chat-header-actions { display: flex; gap: 8px; }
        .icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 8px; width: auto; }
        
        .messages { flex: 1; padding: 16px; overflow-y: auto; background-size: cover; background-position: center; }
        
        .message { margin-bottom: 12px; animation: fadeIn 0.3s; }
        .message-own { display: flex; justify-content: flex-end; }
        .message-other { display: flex; justify-content: flex-start; }
        .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 20px; position: relative; }
        .message-own .message-bubble { background: #667eea; color: white; }
        .message-other .message-bubble { background: #f0f0f0; color: #333; }
        .message-name { font-size: 11px; font-weight: bold; margin-bottom: 4px; opacity: 0.8; }
        .message-time { font-size: 9px; margin-top: 4px; opacity: 0.6; display: inline-block; }
        .message-text { word-wrap: break-word; line-height: 1.4; font-size: 15px; }
        .message-text .inline-sticker { font-size: 1.3em; display: inline-block; vertical-align: middle; }
        .message-text .inline-sticker-img { width: 1.3em; height: 1.3em; vertical-align: middle; object-fit: contain; display: inline-block; }
        
        .message-image { max-width: 200px; border-radius: 12px; cursor: pointer; }
        .message-video { max-width: 220px; border-radius: 12px; margin-top: 5px; }
        .message-big-sticker { font-size: 48px; cursor: pointer; display: inline-block; }
        .message-big-sticker-img { width: 70px; height: 70px; object-fit: contain; cursor: pointer; }
        
        /* Аудио плеер для мобильных */
        .audio-message { max-width: 260px; margin-top: 5px; background: rgba(0,0,0,0.05); border-radius: 20px; padding: 8px 12px; }
        .audio-message .audio-player { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .audio-message .play-btn { background: none; border: none; font-size: 28px; cursor: pointer; width: auto; padding: 5px; margin: 0; color: inherit; }
        .audio-message .waveform { flex: 1; height: 30px; background: rgba(0,0,0,0.1); border-radius: 15px; overflow: hidden; position: relative; cursor: pointer; }
        .audio-message .waveform-progress { height: 100%; background: #667eea; width: 0%; transition: width 0.1s linear; }
        .audio-message .duration { font-size: 11px; min-width: 45px; text-align: center; }
        .audio-message .duration span { font-size: 11px; }
        .message-own .audio-message .waveform-progress { background: rgba(255,255,255,0.5); }
        
        .message-actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
        .message-action-btn { background: none; border: none; font-size: 13px; cursor: pointer; padding: 4px 8px; border-radius: 10px; }
        .message-own .message-action-btn { color: #ddd; }
        .message-other .message-action-btn { color: #666; }
        .message-action-btn:active { background: rgba(0,0,0,0.1); }
        
        .reactions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .reaction { background: rgba(0,0,0,0.08); padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .reaction:active { background: rgba(0,0,0,0.15); transform: scale(0.95); }
        .reaction-emoji { margin-right: 3px; }
        
        .input-area { padding: 12px; border-top: 1px solid #ddd; background: white; }
        .input-tools { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .tool-btn { width: auto; padding: 10px 14px; margin: 0; font-size: 14px; background: #f3f4f6; color: #333; border: none; border-radius: 25px; cursor: pointer; }
        .tool-btn:active { background: #e0e0e0; transform: scale(0.96); }
        .record-btn { background: #ef4444 !important; color: white !important; animation: pulse 1s infinite; }
        .input-row { display: flex; gap: 10px; }
        .input-row input { flex: 1; margin: 0; padding: 12px; border-radius: 25px; }
        .input-row button { width: 50px; margin: 0; border-radius: 25px; }
        .voice-timer { display: inline-block; font-size: 13px; color: #ef4444; margin-left: 10px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { font-size: 28px; cursor: pointer; }
        
        .profile-view { text-align: center; }
        .profile-view-avatar { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; object-fit: cover; }
        
        .game-board { display: grid; grid-template-columns: repeat(3, 70px); gap: 8px; justify-content: center; margin: 20px 0; }
        .game-cell { width: 70px; height: 70px; background: #f0f0f0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .game-cell:active { transform: scale(0.95); background: #e0e0e0; }
        .game-cell.disabled { cursor: not-allowed; opacity: 0.6; pointer-events: none; }
        .game-info { text-align: center; margin: 15px 0; font-weight: bold; font-size: 16px; padding: 10px; background: #f0f0f0; border-radius: 10px; }
        
        .notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 20px; border-radius: 30px; animation: slideIn 0.3s; z-index: 2000; white-space: nowrap; font-size: 14px; }
        
        .clear-chat-btn { background: #dc3545; margin: 10px; width: calc(100% - 20px); }
        .close-sidebar { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 24px; cursor: pointer; width: auto; z-index: 101; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .sticker-grid-item { font-size: 45px; cursor: pointer; text-align: center; padding: 10px; border-radius: 12px; transition: transform 0.2s; }
        .sticker-grid-item:active { transform: scale(0.95); background: #f0f0f0; }
        .sticker-grid-img { width: 50px; height: 50px; object-fit: contain; }
        
        .back-button { background: none; border: none; font-size: 24px; cursor: pointer; padding: 8px; width: auto; color: #333; }
    </style>
</head>
<body>
    <div id="welcomeScreen" class="screen active">
        <div class="welcome-card">
            <h1>💬 SNY</h1>
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('create')">✨ Создать</button>
                <button class="tab-btn" onclick="switchTab('enter')">🔑 Войти</button>
            </div>
            <div id="createTab" class="tab-content active">
                <input type="text" id="newUsername" placeholder="Никнейм">
                <input type="password" id="newPassword" placeholder="Пароль">
                <div><img id="avatarImage" src="https://i.pravatar.cc/150?img=7" style="width:80px; border-radius:50%; margin:10px;"><button onclick="triggerAvatarUpload()">📸 Аватар</button><input type="file" id="avatarFile" accept="image/*" style="display:none"></div>
                <textarea id="userBio" placeholder="О себе" rows="2"></textarea>
                <button onclick="createAccount()">🚀 Создать SNY-ID</button>
            </div>
            <div id="enterTab" class="tab-content">
                <input type="text" id="existingUserId" placeholder="SNY-ID">
                <input type="password" id="existingPassword" placeholder="Пароль">
                <button onclick="loginWithId()">🔓 Войти</button>
            </div>
        </div>
    </div>

    <div id="messengerScreen" class="screen" style="display:none">
        <div class="messenger-container">
            <div class="sidebar" id="sidebar">
                <button class="close-sidebar" onclick="closeMobileSidebar()" style="display:none;">✕</button>
                <div class="user-profile" onclick="showProfile(currentUser.id)">
                    <img id="profileAvatar" class="profile-avatar" src=""><div class="profile-info"><h3 id="profileName"></h3><small id="profileId"></small><div id="lastSeen" style="font-size:10px; color:#666;"></div></div>
                    <button class="copy-id" onclick="copyToClipboard(currentUser.id, event)">📋</button>
                </div>
                <button class="clear-chat-btn" onclick="clearChat()">🗑️ Очистить чат</button>
                <div class="chats-list" id="chatsList"></div>
            </div>
            <div class="chat-area">
                <div class="chat-header">
                    <button class="menu-toggle" onclick="toggleMobileSidebar()">☰</button>
                    <div class="chat-header-info" id="chatHeaderInfo">
                        <img id="chatHeaderAvatar" class="chat-header-avatar" src=""><div><div class="chat-header-name" id="chatHeaderName"></div><div class="chat-header-id" id="chatHeaderId"></div></div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn" onclick="showThemeModal()">🎨</button>
                        <button class="icon-btn" onclick="showWallpaperModal()">🖼️</button>
                        <button class="icon-btn" onclick="showGroupSettings()" id="groupSettingsBtn" style="display:none">⚙️</button>
                    </div>
                </div>
                <div class="messages" id="messagesList"></div>
                <div class="input-area">
                    <div class="input-tools">
                        <button class="tool-btn" onclick="attachImage()">🖼️ Фото</button>
                        <button class="tool-btn" onclick="attachVideo()">🎥 Видео</button>
                        <button class="tool-btn" id="voiceRecordBtn" onclick="toggleVoiceRecord()">🎙️ ГС</button>
                        <button class="tool-btn" onclick="openStickerModal()">😊 Стикер</button>
                        <span id="voiceTimer" class="voice-timer" style="display:none;"></span>
                        <input type="file" id="imageInput" accept="image/*" style="display:none">
                        <input type="file" id="videoFile" accept="video/*" style="display:none">
                        <input type="file" id="stickerImageInput" accept="image/*" style="display:none">
                    </div>
                    <div class="input-row">
                        <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="handleEnter(event)">
                        <button onclick="sendMessage()">📤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальные окна (сокращены для экономии места) -->
    <div id="profileModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>👤 Профиль</h3><span class="close-modal" onclick="closeModal('profileModal')">&times;</span></div><div id="profileContent"></div></div></div>
    <div id="themeModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🎨 Темы</h3><span class="close-modal" onclick="closeModal('themeModal')">&times;</span></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><button onclick="changeTheme('default')">🌙 По умолчанию</button><button onclick="changeTheme('pink')">🌸 Розовая</button><button onclick="changeTheme('red')">❤️ Красная</button><button onclick="changeTheme('blue')">💙 Синяя</button><button onclick="changeTheme('green')">💚 Зеленая</button><button onclick="changeTheme('purple')">🟣 Фиолетовая</button><button onclick="changeTheme('orange')">🟠 Оранжевая</button></div></div></div>
    <div id="wallpaperModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🖼️ Обои</h3><span class="close-modal" onclick="closeModal('wallpaperModal')">&times;</span></div><button onclick="setWallpaper('default')">По умолчанию</button><button onclick="uploadWallpaper()">📤 Своё фото</button><input type="file" id="wallpaperFile" accept="image/*" style="display:none"></div></div>
    <div id="stickerModalWindow" class="modal"><div class="modal-content"><div class="modal-header"><h3>😊 Стикеры</h3><span class="close-modal" onclick="closeModal('stickerModalWindow')">&times;</span></div><button onclick="openStickerImageUpload()">📸 Стикер из фото</button><div id="stickersGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px;"></div></div></div>
    <div id="gameModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🎮 Крестики-нолики</h3><span class="close-modal" onclick="closeModal('gameModal')">&times;</span></div><div id="gameContent"></div></div></div>
    <div id="groupSettingsModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>⚙️ Настройки</h3><span class="close-modal" onclick="closeModal('groupSettingsModal')">&times;</span></div><div><label>Аватар группы</label><img id="groupAvatarPreview" style="width:100px;border-radius:50%;margin:10px auto;display:block"><button onclick="uploadGroupAvatar()">📸 Изменить</button><input type="file" id="groupAvatarFile" accept="image/*" style="display:none"></div><div><label>Описание</label><textarea id="groupDescription" rows="3" placeholder="Описание группы"></textarea><button onclick="saveGroupSettings()">Сохранить</button></div></div></div>
    <div id="reactionModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>😊 Реакции</h3><span class="close-modal" onclick="closeModal('reactionModal')">&times;</span></div><div id="reactionPicker" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;"></div></div></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBfXUgZnRD013c1jPQ04X3ZRRCHJSwE6NQ",
            authDomain: "sny-messenger.firebaseapp.com",
            projectId: "sny-messenger",
            storageBucket: "sny-messenger.firebasestorage.app",
            messagingSenderId: "495989032426",
            appId: "1:495989032426:web:21094d0b3fb3f544579e93"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = null;
        let currentChat = { type: 'general' };
        let allMessages = [];
        let customStickers = [];
        let gameUnsubscribe = null;
        
        // Для голосовых сообщений
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordStartTime = null;
        let recordTimerInterval = null;
        
        // Аудиоплееры
        let activeAudios = {};

        const availableReactions = ['👍', '❤️', '😂', '😮', '😢', '😡', '🎉', '🙏'];

        function showNotification(msg) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerText = msg;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(date) {
            if (!date) return 'неизвестно';
            const d = date.toDate ? date.toDate() : new Date(date);
            return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Мобильное меню
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('mobile-open');
            const closeBtn = document.querySelector('.close-sidebar');
            if (sidebar.classList.contains('mobile-open')) {
                closeBtn.style.display = 'block';
            } else {
                closeBtn.style.display = 'none';
            }
        }

        function closeMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('mobile-open');
            document.querySelector('.close-sidebar').style.display = 'none';
        }

        // Голосовые сообщения
        async function toggleVoiceRecord() {
            if (!isRecording) {
                startVoiceRecording();
            } else {
                stopVoiceRecording();
            }
        }

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => { audioChunks.push(event.data); };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = async (event) => { await sendVoiceMessage(event.target.result); };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordStartTime = Date.now();
                
                const btn = document.getElementById('voiceRecordBtn');
                btn.textContent = '⏹️ Стоп';
                btn.classList.add('record-btn');
                
                const timerDiv = document.getElementById('voiceTimer');
                timerDiv.style.display = 'inline-block';
                recordTimerInterval = setInterval(updateVoiceTimer, 1000);
                showNotification('🎙️ Запись...');
            } catch (error) {
                showNotification('❌ Нет доступа к микрофону!');
            }
        }

        function updateVoiceTimer() {
            if (!recordStartTime) return;
            const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
            const timerDiv = document.getElementById('voiceTimer');
            timerDiv.textContent = `🎙️ ${formatDuration(elapsed)}`;
        }

        async function stopVoiceRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                const btn = document.getElementById('voiceRecordBtn');
                btn.textContent = '🎙️ ГС';
                btn.classList.remove('record-btn');
                clearInterval(recordTimerInterval);
                const timerDiv = document.getElementById('voiceTimer');
                timerDiv.style.display = 'none';
                timerDiv.textContent = '';
                showNotification('⏹️ Отправка...');
            }
        }

        async function sendVoiceMessage(audioDataUrl) {
            if (!currentChat || currentChat.type === 'game') return;

        // Создание аудиоплеера с кнопкой Play
        function createAudioPlayer(audioUrl, duration, messageId) {
            const audio = new Audio(audioUrl);
            let isPlaying = false;
            
            const container = document.createElement('div');
            container.className = 'audio-player';
            container.innerHTML = `
                <button class="play-btn" data-msg-id="${messageId}">▶️</button>
                <div class="waveform" data-msg-id="${messageId}">
                    <div class="waveform-progress" id="progress-${messageId}"></div>
                </div>
                <div class="duration"><span>${formatDuration(duration)}</span></div>
            `;
            
            const playBtn = container.querySelector('.play-btn');
            const waveform = container.querySelector('.waveform');
            const progressBar = container.querySelector(`#progress-${messageId}`);
            
            playBtn.onclick = () => {
                if (activeAudios[messageId] && !audio.paused) {
                    audio.pause();
                    playBtn.textContent = '▶️';
                    delete activeAudios[messageId];
                } else {
                    // Останавливаем все другие аудио
                    for (const [id, aud] of Object.entries(activeAudios)) {
                        if (aud && !aud.paused) {
                            aud.pause();
                            const otherBtn = document.querySelector(`.play-btn[data-msg-id="${id}"]`);
                            if (otherBtn) otherBtn.textContent = '▶️';
                        }
                    }
                    audio.play();
                    playBtn.textContent = '⏸️';
                    activeAudios[messageId] = audio;
                    
                    audio.ontimeupdate = () => {
                        const percent = (audio.currentTime / audio.duration) * 100;
                        progressBar.style.width = `${percent}%`;
                    };
                    audio.onended = () => {
                        playBtn.textContent = '▶️';
                        progressBar.style.width = '0%';
                        delete activeAudios[messageId];
                    };
                }
            };
            
            waveform.onclick = (e) => {
                const rect = waveform.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = x / rect.width;
                audio.currentTime = percent * audio.duration;
            };
            
            return container;
        }

        function insertStickerIntoInput(sticker, stickerUrl) {

        function parseStickersInText(text) {
            const stickerRegex = /\[sticker:(.*?)\]/g;
            const stickerImgRegex = /\[sticker-img:(.*?)\]/g;
            let parts = [], lastIndex = 0, match;
            while ((match = stickerImgRegex.exec(text)) !== null) {
                if (match.index > lastIndex) parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
                parts.push({ type: 'sticker-img', content: match[1] });
                lastIndex = match.index + match[0].length;
            }
            let remainingText = text.substring(lastIndex);
            lastIndex = 0;
            while ((match = stickerRegex.exec(remainingText)) !== null) {
                if (match.index > lastIndex) parts.push({ type: 'text', content: remainingText.substring(lastIndex, match.index) });
                parts.push({ type: 'sticker', content: match[1] });
                lastIndex = match.index + match[0].length;
            }
            if (lastIndex < remainingText.length) parts.push({ type: 'text', content: remainingText.substring(lastIndex) });
            return parts;
        }

        function displayMessage(msg) {
            const container = document.getElementById('messagesList');
            if (!container) return;
            const div = document.createElement('div');
            const isOwn = msg.userId === currentUser.id;
            div.className = 'message ' + (isOwn ? 'message-own' : 'message-other');
            const time = msg.timestamp?.toDate ? new Date(msg.timestamp.toDate()).toLocaleTimeString() : '';
            
            let content = '';
            if (msg.type === 'text') {
                const parts = parseStickersInText(msg.text);
                let htmlContent = '';
                for (const part of parts) {
                    if (part.type === 'text') htmlContent += escapeHtml(part.content);
                    else if (part.type === 'sticker') htmlContent += `<span class="inline-sticker">${part.content}</span>`;
                    else if (part.type === 'sticker-img') htmlContent += `<img src="${part.content}" class="inline-sticker-img" alt="sticker">`;
                }
                content = `<div class="message-text">${htmlContent}</div>`;
            } else if (msg.type === 'image') {
                content = `<img src="${msg.imageUrl}" class="message-image" onclick="window.open('${msg.imageUrl}','_blank')">`;
            } else if (msg.type === 'video') {
                content = `<video src="${msg.videoUrl}" controls class="message-video" style="max-width:200px; border-radius:12px;"></video>`;
            } else if (msg.type === 'voice') {
                const duration = msg.duration || 1;
                const audioPlayer = createAudioPlayer(msg.audioUrl, duration, msg.id);
                const wrapper = document.createElement('div');
                wrapper.className = 'audio-message';
                wrapper.appendChild(audioPlayer);
                content = wrapper.outerHTML;
            } else if (msg.type === 'sticker') {
                if (msg.stickerUrl) content = `<img src="${msg.stickerUrl}" class="message-big-sticker-img">`;
                else content = `<div class="message-big-sticker">${msg.sticker}</div>`;
            }
            
            let reactionsHtml = '';
            if (msg.reactions && Object.keys(msg.reactions).length > 0) {
                reactionsHtml = '<div class="reactions">';
                for (const [emoji, users] of Object.entries(msg.reactions)) {
                    reactionsHtml += `<span class="reaction" onclick="addReaction('${msg.id}', '${emoji}')"><span class="reaction-emoji">${emoji}</span> ${users.length}</span>`;
                }
                reactionsHtml += '</div>';
            }
            
            let actionsHtml = `<div class="message-actions"><button class="message-action-btn" onclick="showReactionPicker('${msg.id}')">😊</button><button class="message-action-btn" onclick="deleteMessage('${msg.id}', ${isOwn})">🗑️</button></div>`;
            if (isOwn && msg.type === 'text') {
                actionsHtml = `<div class="message-actions"><button class="message-action-btn" onclick="editMessage('${msg.id}', '${escapeHtml(msg.text)}')">✏️</button><button class="message-action-btn" onclick="showReactionPicker('${msg.id}')">😊</button><button class="message-action-btn" onclick="deleteMessage('${msg.id}', true)">🗑️</button></div>`;
            }
            
            div.innerHTML = `<div class="message-bubble"><div class="message-name">${escapeHtml(msg.userName)}</div>${content}${reactionsHtml}${actionsHtml}<div class="message-time">${time}</div></div>`;
            container.appendChild(div);
            
            // Пересоздаем аудиоплееры для голосовых
            if (msg.type === 'voice') {
                const audioDiv = div.querySelector('.audio-message');
                if (audioDiv) {
                    const audioPlayer = createAudioPlayer(msg.audioUrl, msg.duration || 1, msg.id);
                    audioDiv.innerHTML = '';
                    audioDiv.appendChild(audioPlayer);
                }
            }
        }

            document.getElementById('profileModal').classList.add('active');
        }

        function copyToClipboard(text, event) { if (event) event.stopPropagation(); navigator.clipboard.writeText(text); showNotification('✅ ID скопирован'); }
        function showThemeModal() { document.getElementById('themeModal').classList.add('active'); }
        function changeTheme(theme) { document.body.className = `theme-${theme}`; }
        function showWallpaperModal() { document.getElementById('wallpaperModal').classList.add('active'); }

        // Игра
        let gameBoardData = ['', '', '', '', '', '', '', '', ''];
        let gameCurrentPlayer = 'X';
        let gameActiveGame = true;
        let gameWinner = null;

        function startGameSync() {
            if (gameUnsubscribe) gameUnsubscribe();
            gameUnsubscribe = db.collection('game').doc('tic-tac-toe').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    gameBoardData = data.board || ['', '', '', '', '', '', '', '', ''];
                    gameCurrentPlayer = data.currentPlayer || 'X';
                    gameActiveGame = data.active !== false;
                    gameWinner = data.winner;
                    renderGameBoardUI();
                } else resetGameInFirebase();
            });
        }

        async function resetGameInFirebase() {
            await db.collection('game').doc('tic-tac-toe').set({ board: ['', '', '', '', '', '', '', '', ''], currentPlayer: 'X', active: true, winner: null, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        }

        async function makeGameMove(index) {
            if (!gameActiveGame || gameWinner || gameBoardData[index] !== '') return;
            const newBoard = [...gameBoardData];
            newBoard[index] = gameCurrentPlayer;
            const winner = checkWinnerOnBoard(newBoard);
            if (winner) {
                await db.collection('game').doc('tic-tac-toe').update({ board: newBoard, active: false, winner: winner });
                showNotification(`🏆 Победил ${winner === 'X' ? 'Крестик' : 'Нолик'}!`);
            } else if (newBoard.every(cell => cell !== '')) {
                await db.collection('game').doc('tic-tac-toe').update({ board: newBoard, active: false, winner: 'Ничья!' });
                showNotification('🤝 Ничья!');
            } else {
                const nextPlayer = gameCurrentPlayer === 'X' ? 'O' : 'X';
                await db.collection('game').doc('tic-tac-toe').update({ board: newBoard, currentPlayer: nextPlayer });
                showNotification(`${nextPlayer === 'X' ? '❌' : '⭕'} Ход ${nextPlayer === 'X' ? 'Крестиков' : 'Ноликов'}`);
            }
        }

        function checkWinnerOnBoard(board) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let w of wins) if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) return board[w[0]];
            return null;
        }

        async function resetGame() { await resetGameInFirebase(); }

        function renderGameBoardUI() {
            const container = document.getElementById('gameContent');
            if (!container) return;
            let statusText = gameWinner === 'Ничья!' ? '🤝 Ничья!' : (gameWinner ? `🏆 Победили ${gameWinner === 'X' ? 'Крестики' : 'Нолики'}!` : `🎮 Ход: ${gameCurrentPlayer === 'X' ? '❌ Крестики' : '⭕ Нолики'}`);
            const isPlayerTurn = gameActiveGame && !gameWinner;
            container.innerHTML = `<div class="game-info">${statusText}</div><div class="game-board" id="gameBoard"></div><button onclick="resetGame()">🔄 Новая игра</button>`;
            const board = document.getElementById('gameBoard');
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'game-cell';
                if (!isPlayerTurn || gameBoardData[i] !== '') cell.classList.add('disabled');
                cell.textContent = gameBoardData[i];
                cell.onclick = () => { if (isPlayerTurn && !gameBoardData[i]) makeGameMove(i); };
                board.appendChild(cell);
            }
        }

        function showGameModal() { startGameSync(); document.getElementById('gameModal').classList.add('active'); }

        function handleEnter(event) { if (event.key === 'Enter') sendMessage(); }
        function closeModal(modalId) { document.getElementById(modalId).classList.remove('active'); }
        window.onclick = function(event) { if (event.target.classList.contains('modal')) event.target.classList.remove('active'); }

        async function checkSavedUser() {
            const saved = localStorage.getItem('sny_user_id');
            const savedPass = localStorage.getItem('sny_password');
            if (saved && savedPass) {
                const userDoc = await db.collection('users').doc(saved).get();
                if (userDoc.exists && userDoc.data().password === savedPass) { currentUser = userDoc.data(); enterMessenger(); }
            }
        }
        checkSavedUser();
    </script>
</body>
