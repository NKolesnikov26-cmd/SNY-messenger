<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNY - Мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            transition: background 0.3s;
        }

        .theme-default { background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); }
        .theme-pink { background: linear-gradient(135deg, #7c5a6e 0%, #c9a3b8 100%); }
        .theme-red { background: linear-gradient(135deg, #8b5a5a 0%, #c98a8a 100%); }
        .theme-blue { background: linear-gradient(135deg, #4a6a8b 0%, #8aadc9 100%); }
        .theme-green { background: linear-gradient(135deg, #4a6b5a 0%, #8aad9a 100%); }
        .theme-purple { background: linear-gradient(135deg, #6b4a8b 0%, #a98ac9 100%); }
        .theme-orange { background: linear-gradient(135deg, #8b6a4a 0%, #c9aa8a 100%); }
        .theme-teal { background: linear-gradient(135deg, #4a6b6b 0%, #8aadad 100%); }
        .theme-indigo { background: linear-gradient(135deg, #5a4a8b 0%, #9a8ac9 100%); }
        .theme-cyan { background: linear-gradient(135deg, #4a6b8b 0%, #8aaac9 100%); }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .screen.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-card {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .welcome-card h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        input, button, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        textarea {
            resize: vertical;
            font-family: inherit;
        }

        .messenger-container {
            display: flex;
            width: 1400px;
            max-width: 100%;
            height: 90vh;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .sidebar {
            width: 320px;
            background: #f9fafb;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .user-profile {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-profile:hover {
            background: #f3f4f6;
        }

        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
        }

        .profile-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .profile-info small {
            font-size: 11px;
            color: #6b7280;
        }

        .copy-id {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            width: auto;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .chat-item:hover {
            background: #f3f4f6;
        }

        .chat-item.active {
            background: #e0e7ff;
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-last-msg {
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .pinned-chat {
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-header-name {
            font-weight: 600;
        }

        .chat-header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            width: auto;
            color: #6b7280;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s;
            position: relative;
        }

        .message-own {
            display: flex;
            justify-content: flex-end;
        }

        .message-other {
            display: flex;
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
        }

        .message-own .message-bubble {
            background: #667eea;
            color: white;
        }

        .message-other .message-bubble {
            background: white;
            border: 1px solid #e5e7eb;
        }

        .message-name {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .message-time {
            font-size: 9px;
            margin-top: 5px;
            opacity: 0.6;
            display: inline-block;
            margin-right: 10px;
        }

        .message-text {
            word-wrap: break-word;
        }

        .message-image {
            max-width: 250px;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
        }

        .message-video {
            max-width: 250px;
            border-radius: 10px;
            margin-top: 5px;
        }

        .message-sticker {
            font-size: 48px;
            cursor: pointer;
        }

        .message-actions {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .message-action-btn {
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 5px;
            width: auto;
            color: #6b7280;
        }

        .reactions {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .reaction {
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .views-info {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 5px;
            cursor: pointer;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        .input-tools {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tool-btn {
            width: auto;
            padding: 8px 12px;
            margin: 0;
            font-size: 14px;
            background: #f3f4f6;
            color: #374151;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            margin: 0;
        }

        .input-row button {
            width: 50px;
            margin: 0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            font-size: 28px;
            cursor: pointer;
        }

        .profile-view {
            text-align: center;
        }

        .profile-view-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .custom-sticker {
            width: 60px;
            height: 60px;
            object-fit: contain;
            cursor: pointer;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 5px;
            justify-content: center;
            margin: 20px 0;
        }

        .game-cell {
            background: #f0f0f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .game-cell:hover {
            background: #e0e0e0;
        }

        .game-cell.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .game-info {
            text-align: center;
            margin: 10px 0;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            animation: slideIn 0.3s;
            z-index: 2000;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .private-note {
            background: #fffacd;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
        
        .game-status {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .game-reset-btn {
            background: #f59e0b;
            margin-top: 10px;
        }
    </style>
</head>
<body class="theme-default">
    <div id="welcomeScreen" class="screen active">
        <div class="welcome-card">
            <h1>💬 SNY</h1>
            <p>Твой личный мессенджер</p>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('create')">✨ Создать</button>
                <button class="tab-btn" onclick="switchTab('enter')">🔑 Войти</button>
            </div>

            <div id="createTab" class="tab-content active">
                <input type="text" id="newUsername" placeholder="Твой никнейм" maxlength="20">
                <input type="password" id="newPassword" placeholder="Придумай пароль">
                <div class="avatar-section">
                    <img id="avatarImage" src="https://i.pravatar.cc/150?img=7" alt="avatar" style="width:100px; border-radius:50%; margin-bottom:10px;">
                    <button onclick="triggerAvatarUpload()">📸 Загрузить аватар</button>
                    <input type="file" id="avatarFile" accept="image/*" style="display:none">
                </div>
                <textarea id="userBio" placeholder="О себе (необязательно)" rows="3"></textarea>
                <select id="fontColorSelect">
                    <option value="#000000">Черный</option>
                    <option value="#e74c3c">Красный</option>
                    <option value="#27ae60">Зеленый</option>
                    <option value="#2980b9">Синий</option>
                    <option value="#e84393">Розовый</option>
                    <option value="#f39c12">Оранжевый</option>
                    <option value="#8e44ad">Фиолетовый</option>
                </select>
                <button onclick="createAccount()">🚀 Создать SNY-ID</button>
            </div>

            <div id="enterTab" class="tab-content">
                <input type="text" id="existingUserId" placeholder="Введи свой SNY-ID">
                <input type="password" id="existingPassword" placeholder="Пароль">
                <button onclick="loginWithId()">🔓 Войти</button>
            </div>
        </div>
    </div>

    <div id="messengerScreen" class="screen" style="display:none">
        <div class="messenger-container">
            <div class="sidebar">
                <div class="user-profile" onclick="showProfile(currentUser.id)">
                    <img id="profileAvatar" class="profile-avatar" src="">
                    <div class="profile-info">
                        <h3 id="profileName"></h3>
                        <small id="profileId"></small>
                    </div>
                    <button class="copy-id" onclick="copyToClipboard(currentUser.id, event)">📋</button>
                </div>
                
                <div class="chats-list" id="chatsList"></div>
            </div>
            
            <div class="chat-area">
                <div class="chat-header">
                    <div class="chat-header-info" id="chatHeaderInfo">
                        <img id="chatHeaderAvatar" class="chat-header-avatar" src="">
                        <div>
                            <div class="chat-header-name" id="chatHeaderName"></div>
                            <small id="chatHeaderId"></small>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn" onclick="showThemeModal()">🎨</button>
                        <button class="icon-btn" onclick="showWallpaperModal()">🖼️ Обои</button>
                        <button class="icon-btn" onclick="showGroupSettings()" id="groupSettingsBtn" style="display:none">⚙️</button>
                    </div>
                </div>
                
                <div class="messages" id="messagesList"></div>
                
                <div class="input-area">
                    <div class="input-tools">
                        <button class="tool-btn" onclick="attachImage()">🖼️ Фото</button>
                        <button class="tool-btn" onclick="attachVideo()">🎥 Видео</button>
                        <button class="tool-btn" onclick="openStickerModal()">😊 Стикер</button>
                        <button class="tool-btn" onclick="openPrivateNote()">📝 Личное</button>
                        <input type="file" id="imageInput" accept="image/*" style="display:none">
                        <input type="file" id="videoFile" accept="video/*" style="display:none">
                        <input type="file" id="stickerImageInput" accept="image/*" style="display:none">
                    </div>
                    <div class="input-row">
                        <input type="text" id="messageInput" placeholder="Напиши сообщение..." onkeypress="handleEnter(event)">
                        <button onclick="sendMessage()">📤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="viewsModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>👁️ Просмотры</h3><span class="close-modal" onclick="closeModal('viewsModal')">&times;</span></div><div id="viewsList"></div></div></div>
    <div id="profileModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>👤 Профиль</h3><span class="close-modal" onclick="closeModal('profileModal')">&times;</span></div><div id="profileContent" class="profile-view"></div></div></div>
    <div id="themeModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🎨 Темы</h3><span class="close-modal" onclick="closeModal('themeModal')">&times;</span></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><button onclick="changeTheme('default')">🌙 По умолчанию</button><button onclick="changeTheme('pink')">🌸 Розовая</button><button onclick="changeTheme('red')">❤️ Красная</button><button onclick="changeTheme('blue')">💙 Синяя</button><button onclick="changeTheme('green')">💚 Зеленая</button><button onclick="changeTheme('purple')">🟣 Фиолетовая</button><button onclick="changeTheme('orange')">🟠 Оранжевая</button><button onclick="changeTheme('teal')">🩵 Бирюзовая</button><button onclick="changeTheme('indigo')">🔷 Индиго</button><button onclick="changeTheme('cyan')">💎 Циан</button></div></div></div>
    
    <div id="wallpaperModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🖼️ Обои чата</h3><span class="close-modal" onclick="closeModal('wallpaperModal')">&times;</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><button onclick="setWallpaper('default')">По умолчанию</button><button onclick="setWallpaper('https://www.transparenttextures.com/patterns/cubes.png')">Кубики</button><button onclick="setWallpaper('https://www.transparenttextures.com/patterns/diagmonds.png')">Ромбы</button><button onclick="setWallpaper('https://www.transparenttextures.com/patterns/flowers.png')">Цветы</button><button onclick="uploadWallpaper()">📤 Своё фото</button></div><input type="file" id="wallpaperFile" accept="image/*" style="display:none"></div></div>
    
    <div id="stickerModalWindow" class="modal"><div class="modal-content"><div class="modal-header"><h3>😊 Стикеры</h3><span class="close-modal" onclick="closeModal('stickerModalWindow')">&times;</span></div><button onclick="openStickerImageUpload()">📸 Стикер из фото</button><div id="stickersGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px;"></div></div></div>
    
    <div id="fontColorModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🎨 Цвет шрифта</h3><span class="close-modal" onclick="closeModal('fontColorModal')">&times;</span></div><input type="color" id="fontColorPicker" value="#000000"><button onclick="saveFontColor()">Сохранить</button></div></div>
    
    <div id="editMessageModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>✏️ Редактировать</h3><span class="close-modal" onclick="closeModal('editMessageModal')">&times;</span></div><input type="text" id="editMessageInput" placeholder="Новый текст"><button onclick="saveEditedMessage()">Сохранить</button></div></div>
    
    <div id="groupSettingsModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>⚙️ Настройки группы</h3><span class="close-modal" onclick="closeModal('groupSettingsModal')">&times;</span></div><div><label>Аватар группы</label><img id="groupAvatarPreview" style="width:100px;border-radius:50%;margin:10px auto;display:block"><button onclick="uploadGroupAvatar()">📸 Изменить аватар</button><input type="file" id="groupAvatarFile" accept="image/*" style="display:none"></div><div><label>Описание группы</label><textarea id="groupDescription" rows="3" placeholder="Описание группы"></textarea><button onclick="saveGroupSettings()">Сохранить</button></div></div></div>
    
    <div id="gameModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🎮 Крестики-нолики</h3><span class="close-modal" onclick="closeModal('gameModal')">&times;</span></div><div id="gameContent"></div></div></div>
    
    <div id="privateNoteModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>📝 Личная заметка</h3><span class="close-modal" onclick="closeModal('privateNoteModal')">&times;</span></div><textarea id="privateNoteText" rows="5" placeholder="Твои личные заметки... (видно только тебе)"></textarea><button onclick="savePrivateNote()">Сохранить</button><div id="privateNoteDisplay" class="private-note" style="margin-top:15px;"></div></div></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBfXUgZnRD013c1jPQ04X3ZRRCHJSwE6NQ",
            authDomain: "sny-messenger.firebaseapp.com",
            projectId: "sny-messenger",
            storageBucket: "sny-messenger.firebasestorage.app",
            messagingSenderId: "495989032426",
            appId: "1:495989032426:web:21094d0b3fb3f544579e93"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = null;
        let currentChat = { type: 'general' };
        let messagesUnsubscribe = null;
        let customStickers = [];
        let editingMessageId = null;
        let gameUnsubscribe = null;
        let wallpaperUnsubscribe = null;

        function showNotification(msg) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerText = msg;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function switchTab(tab) {
            const createTab = document.getElementById('createTab');
            const enterTab = document.getElementById('enterTab');
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (tab === 'create') {
                createTab.classList.add('active');
                enterTab.classList.remove('active');
                btns[0].classList.add('active');
            } else {
                createTab.classList.remove('active');
                enterTab.classList.add('active');
                btns[1].classList.add('active');
            }
        }

        function triggerAvatarUpload() { document.getElementById('avatarFile').click(); }
        document.getElementById('avatarFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => { document.getElementById('avatarImage').src = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        async function createAccount() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;

        function loadMessages(chatType, otherUserId = null) {
            if (messagesUnsubscribe) messagesUnsubscribe();
            
            let query;
            if (chatType === 'general') {
                query = db.collection('messages').where('chatType', '==', 'general').orderBy('timestamp', 'asc');
            } else if (chatType === 'private') {
                const chatId = getPrivateChatId(currentUser.id, otherUserId);
                query = db.collection('messages').where('chatId', '==', chatId).orderBy('timestamp', 'asc');
            } else {
                return;
            }
            
            messagesUnsubscribe = query.onSnapshot((snapshot) => {
                const container = document.getElementById('messagesList');
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    msg.id = doc.id;
                    displayMessage(msg);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function displayMessage(msg) {
            const container = document.getElementById('messagesList');
            const div = document.createElement('div');
            const isOwn = msg.userId === currentUser.id;
            div.className = 'message ' + (isOwn ? 'message-own' : 'message-other');
            
            const time = msg.timestamp?.toDate ? new Date(msg.timestamp.toDate()).toLocaleTimeString() : '';
            const senderColor = msg.fontColor || '#000000';
            
            let content = '';
            if (msg.type === 'text') content = `<div class="message-text" style="color: ${senderColor}">${escapeHtml(msg.text)}</div>`;
            else if (msg.type === 'image') content = `<img src="${msg.imageUrl}" class="message-image" onclick="viewImage('${msg.imageUrl}')">`;
            else if (msg.type === 'video') content = `<video src="${msg.videoUrl}" controls class="message-video"></video>`;
            else if (msg.type === 'sticker') {
                if (msg.stickerUrl) content = `<img src="${msg.stickerUrl}" class="custom-sticker" style="width:80px">`;
                else content = `<div class="message-sticker">${msg.sticker}</div>`;
            }
            
            let reactionsHtml = '';
            if (msg.reactions) {
                const reactionList = Object.entries(msg.reactions);
                if (reactionList.length > 0) {
                    reactionsHtml = '<div class="reactions">';
                    reactionList.forEach(([emoji, users]) => {
                        reactionsHtml += `<span class="reaction" onclick="addReaction('${msg.id}', '${emoji}')"><span class="reaction-emoji">${emoji}</span> ${users.length}</span>`;
                    });
                    reactionsHtml += '</div>';
                }
            }
            
            let viewsHtml = '';
            if (!isOwn && msg.views && !msg.views.includes(currentUser.id)) setTimeout(() => markAsViewed(msg.id), 1000);
            if (msg.views && msg.views.length > 0) viewsHtml = `<div class="views-info" onclick="showViews('${msg.id}')">👁️ ${msg.views.length} просмотров</div>`;
            
            let actionsHtml = '';
            if (isOwn) {
                actionsHtml = `<div class="message-actions"><button class="message-action-btn" onclick="editMessage('${msg.id}', '${escapeHtml(msg.text)}')">✏️</button><button class="message-action-btn" onclick="deleteMessage('${msg.id}')">🗑️</button></div>`;
            }
            
            div.innerHTML = `<div class="message-bubble"><div class="message-name">${escapeHtml(msg.userName)}</div>${content}${reactionsHtml}${viewsHtml}${actionsHtml}<div class="message-time">${time}</div></div>`;
            container.appendChild(div);
        }

        // Синхронизированная игра Крестики-нолики
        let gameBoardData = ['', '', '', '', '', '', '', '', ''];
        let gameCurrentPlayer = 'X';
        let gameActive = true;
        let gameWinner = null;
        
        function startGameSync() {
            if (gameUnsubscribe) gameUnsubscribe();
            gameUnsubscribe = db.collection('game').doc('tic-tac-toe').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    gameBoardData = data.board || ['', '', '', '', '', '', '', '', ''];
                    gameCurrentPlayer = data.currentPlayer || 'X';
                    gameActive = data.active !== false;
                    gameWinner = data.winner;
                    renderGameBoard();
                } else {
                    resetGameInFirebase();
                }
            });
        }
        
        async function resetGameInFirebase() {
            await db.collection('game').doc('tic-tac-toe').set({
                board: ['', '', '', '', '', '', '', '', ''],
                currentPlayer: 'X',
                active: true,
                winner: null,
                lastMove: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        
        async function makeGameMove(index) {
            if (!gameActive || gameWinner || gameBoardData[index] !== '') {
                showNotification('❌ Невозможный ход!');
                return;
            }
            
            // Обновляем в Firebase
            const newBoard = [...gameBoardData];
            newBoard[index] = gameCurrentPlayer;
            
            // Проверка победителя
            const winner = checkWinnerOnBoard(newBoard);
            let active = true;
            let winnerSymbol = null;
            
            if (winner) {
                active = false;
                winnerSymbol = winner;
                showNotification(`🏆 Победил ${winner === 'X' ? 'Крестик' : 'Нолик'}!`);
            } else if (newBoard.every(cell => cell !== '')) {
                active = false;
                winnerSymbol = 'Ничья!';
                showNotification(`🤝 Ничья!`);
            } else {
                // Меняем игрока
                const nextPlayer = gameCurrentPlayer === 'X' ? 'O' : 'X';
                await db.collection('game').doc('tic-tac-toe').update({
                    board: newBoard,
                    currentPlayer: nextPlayer,
                    lastMove: firebase.firestore.FieldValue.serverTimestamp()
                });
                return;
            }
            
            await db.collection('game').doc('tic-tac-toe').update({
                board: newBoard,
                active: active,
                winner: winnerSymbol,
                lastMove: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        
        function checkWinnerOnBoard(board) {
            const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let pattern of winPatterns) {
                const [a,b,c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            return null;
        }
        
        async function resetGame() {
            await resetGameInFirebase();
            showNotification('🔄 Игра перезапущена!');
        }
        
        function renderGameBoard() {
            const container = document.getElementById('gameContent');
            if (!container) return;
            
            let statusText = '';
            if (gameWinner === 'Ничья!') statusText = '🤝 Ничья!';
            else if (gameWinner) statusText = `🏆 Победил ${gameWinner === 'X' ? 'Крестик' : 'Нолик'}!`;
            else statusText = `Ход: ${gameCurrentPlayer === 'X' ? '❌ Крестики' : '⭕ Нолики'}`;
            
            container.innerHTML = `
                <div class="game-status">${statusText}</div>
                <div class="game-board" id="gameBoard"></div>
                <button class="game-reset-btn" onclick="resetGame()">🔄 Новая игра</button>
            `;
            
            const board = document.getElementById('gameBoard');
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'game-cell';
                if (!gameActive || gameWinner) cell.classList.add('disabled');
                cell.textContent = gameBoardData[i];
                cell.onclick = () => makeGameMove(i);
                board.appendChild(cell);
            }
        }
        
        function showGameModal() {
            startGameSync();
            document.getElementById('gameModal').classList.add('active');
        }

        // Личные заметки
        async function openPrivateNote() {
            document.getElementById('privateNoteModal').classList.add('active');
            const noteDoc = await db.collection('privateNotes').doc(currentUser.id).get();
            if (noteDoc.exists) document.getElementById('privateNoteDisplay').innerHTML = `<strong>📝 Ваши заметки:</strong><br>${escapeHtml(noteDoc.data().note)}`;
        }
        async function savePrivateNote() {
            const note = document.getElementById('privateNoteText').value;
            await db.collection('privateNotes').doc(currentUser.id).set({ note, updatedAt: new Date() });
            document.getElementById('privateNoteDisplay').innerHTML = `<strong>📝 Ваши заметки:</strong><br>${escapeHtml(note)}`;
            document.getElementById('privateNoteText').value = '';
            showNotification('📝 Заметка сохранена!');
        }
        async function loadPrivateNote() {
            const noteDoc = await db.collection('privateNotes').doc(currentUser.id).get();
            if (noteDoc.exists) document.getElementById('privateNoteDisplay').innerHTML = `<strong>📝 Ваши заметки:</strong><br>${escapeHtml(noteDoc.data().note)}`;
        }

        function viewImage(imageUrl) { window.open(imageUrl, '_blank'); }
        function handleEnter(event) { if (event.key === 'Enter') sendMessage(); }
        function closeModal(modalId) { document.getElementById(modalId).classList.remove('active'); }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        window.onclick = function(event) { if (event.target.classList.contains('modal')) event.target.classList.remove('active'); }

        async function checkSavedUser() {
            const saved = localStorage.getItem('sny_user_id');
            const savedPass = localStorage.getItem('sny_password');
            if (saved && savedPass) {
                const userDoc = await db.collection('users').doc(saved).get();
                if (userDoc.exists && userDoc.data().password === savedPass) {
                    currentUser = userDoc.data();
                    enterMessenger();
                }
            }
        }

        checkSavedUser();
    </script>
</body>
</html>
