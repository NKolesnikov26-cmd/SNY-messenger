<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNY - Мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: background 0.3s;
        }

        /* Темы */
        .theme-default { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .theme-pink { background: linear-gradient(135deg, #ff69b4, #ff1493); }
        .theme-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .theme-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .theme-green { background: linear-gradient(135deg, #10b981, #059669); }
        .theme-purple { background: linear-gradient(135deg, #a855f7, #7c3aed); }
        .theme-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
        .theme-teal { background: linear-gradient(135deg, #14b8a6, #0d9488); }
        .theme-indigo { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .theme-cyan { background: linear-gradient(135deg, #06b6d4, #0891b2); }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .screen.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .welcome-card h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        input, button, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        /* Мессенджер */
        .messenger-container {
            display: flex;
            width: 1400px;
            max-width: 100%;
            height: 90vh;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        /* Боковая панель */
        .sidebar {
            width: 320px;
            background: #f9fafb;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .user-profile {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-profile:hover {
            background: #f3f4f6;
        }

        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
        }

        .profile-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .profile-info small {
            font-size: 11px;
            color: #6b7280;
        }

        .copy-id {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            width: auto;
        }

        /* Чаты */
        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .chat-item:hover {
            background: #f3f4f6;
        }

        .chat-item.active {
            background: #e0e7ff;
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-last-msg {
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .chat-time {
            font-size: 10px;
            color: #9ca3af;
        }

        /* Область чата */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-header-name {
            font-weight: 600;
        }

        .chat-header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            width: auto;
            color: #6b7280;
        }

        /* Сообщения */
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s;
            position: relative;
        }

        .message-own {
            display: flex;
            justify-content: flex-end;
        }

        .message-other {
            display: flex;
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
        }

        .message-own .message-bubble {
            background: #667eea;
            color: white;
        }

        .message-other .message-bubble {
            background: white;
            border: 1px solid #e5e7eb;
        }

        .message-name {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .message-time {
            font-size: 9px;
            margin-top: 5px;
            opacity: 0.6;
            display: inline-block;
            margin-right: 10px;
        }

        .message-text {
            word-wrap: break-word;
        }

        .message-image {
            max-width: 250px;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
        }

        .message-video {
            max-width: 250px;
            border-radius: 10px;
            margin-top: 5px;
        }

        .message-sticker {
            font-size: 48px;
            cursor: pointer;
        }

        /* Реакции */
        .reactions {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .reaction {
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reaction:hover {
            background: rgba(0,0,0,0.2);
        }

        .reaction-emoji {
            margin-right: 3px;
        }

        /* Просмотры */
        .views-info {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 5px;
            cursor: pointer;
        }

        /* Поле ввода */
        .input-area {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        .input-tools {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tool-btn {
            width: auto;
            padding: 8px 12px;
            margin: 0;
            font-size: 14px;
            background: #f3f4f6;
            color: #374151;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            margin: 0;
        }

        .input-row button {
            width: 50px;
            margin: 0;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            font-size: 28px;
            cursor: pointer;
        }

        /* Профиль */
        .profile-view {
            text-align: center;
        }

        .profile-view-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        /* Стикеры из картинок */
        .custom-sticker {
            width: 60px;
            height: 60px;
            object-fit: contain;
            cursor: pointer;
        }

        /* Адаптивность */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="theme-default">
    <!-- Экран входа -->
    <div id="welcomeScreen" class="screen active">
        <div class="welcome-card">
            <h1>💬 SNY</h1>
            <p>Твой личный мессенджер</p>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('create')">✨ Создать</button>
                <button class="tab-btn" onclick="switchTab('enter')">🔑 Войти</button>
            </div>

            <div id="createTab" class="tab-content active">
                <input type="text" id="newUsername" placeholder="Твой никнейм" maxlength="20">
                <div class="avatar-section">
                    <img id="avatarImage" src="https://i.pravatar.cc/150?img=7" alt="avatar" style="width:100px; border-radius:50%; margin-bottom:10px;">
                    <button onclick="triggerAvatarUpload()">📸 Загрузить аватар</button>
                    <input type="file" id="avatarFile" accept="image/*" style="display:none">
                </div>
                <select id="fontColorSelect">
                    <option value="#000000">Черный</option>
                    <option value="#ff0000">Красный</option>
                    <option value="#00ff00">Зеленый</option>
                    <option value="#0000ff">Синий</option>
                    <option value="#ff69b4">Розовый</option>
                    <option value="#ffa500">Оранжевый</option>
                    <option value="#800080">Фиолетовый</option>
                </select>
                <button onclick="createAccount()">🚀 Создать SNY-ID</button>
            </div>

            <div id="enterTab" class="tab-content">
                <input type="text" id="existingUserId" placeholder="Введи свой SNY-ID">
                <button onclick="loginWithId()">🔓 Войти</button>
            </div>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="messengerScreen" class="screen" style="display:none">
        <div class="messenger-container">
            <!-- Левая панель - чаты -->
            <div class="sidebar">
                <div class="user-profile" onclick="showProfile(currentUser.id)">
                    <img id="profileAvatar" class="profile-avatar" src="">
                    <div class="profile-info">
                        <h3 id="profileName"></h3>
                        <small id="profileId"></small>
                    </div>
                    <button class="copy-id" onclick="copyToClipboard(currentUser.id, event)">📋</button>
                </div>
                
                <div class="chats-list" id="chatsList">
                    <!-- Список чатов -->
                </div>
            </div>
            
            <!-- Правая область - чат -->
            <div class="chat-area">
                <div class="chat-header">
                    <div class="chat-header-info" id="chatHeaderInfo">
                        <img id="chatHeaderAvatar" class="chat-header-avatar" src="">
                        <div>
                            <div class="chat-header-name" id="chatHeaderName"></div>
                            <small id="chatHeaderId"></small>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn" onclick="showThemeModal()">🎨</button>
                        <button class="icon-btn" onclick="showFontColorModal()">🎨 Цвет шрифта</button>
                    </div>
                </div>
                
                <div class="messages" id="messagesList"></div>
                
                <div class="input-area">
                    <div class="input-tools">
                        <button class="tool-btn" onclick="attachImage()">🖼️ Фото</button>
                        <button class="tool-btn" onclick="attachVideo()">🎥 Видео</button>
                        <button class="tool-btn" onclick="openStickerModal()">😊 Стикер</button>
                        <input type="file" id="imageInput" accept="image/*" style="display:none">
                        <input type="file" id="videoFile" accept="video/*" style="display:none">
                        <input type="file" id="stickerImageInput" accept="image/*" style="display:none">
                    </div>
                    <div class="input-row">
                        <input type="text" id="messageInput" placeholder="Напиши сообщение..." onkeypress="handleEnter(event)">
                        <button onclick="sendMessage()">📤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка просмотра просмотров -->
    <div id="viewsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>👁️ Просмотры</h3>
                <span class="close-modal" onclick="closeModal('viewsModal')">&times;</span>
            </div>
            <div id="viewsList"></div>
        </div>
    </div>

    <!-- Модалка профиля -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>👤 Профиль</h3>
                <span class="close-modal" onclick="closeModal('profileModal')">&times;</span>
            </div>
            <div id="profileContent" class="profile-view"></div>
        </div>
    </div>

    <!-- Модалка тем -->
    <div id="themeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🎨 Темы оформления</h3>
                <span class="close-modal" onclick="closeModal('themeModal')">&times;</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2,1fr); gap:10px">
                <button onclick="changeTheme('default')">🌙 По умолчанию</button>
                <button onclick="changeTheme('pink')">🌸 Розовая</button>
                <button onclick="changeTheme('red')">❤️ Красная</button>
                <button onclick="changeTheme('blue')">💙 Синяя</button>
                <button onclick="changeTheme('green')">💚 Зеленая</button>
                <button onclick="changeTheme('purple')">🟣 Фиолетовая</button>
                <button onclick="changeTheme('orange')">🟠 Оранжевая</button>
                <button onclick="changeTheme('teal')">🩵 Бирюзовая</button>
                <button onclick="changeTheme('indigo')">🔷 Индиго</button>
                <button onclick="changeTheme('cyan')">💎 Циан</button>
            </div>
        </div>
    </div>

    <!-- Модалка стикеров -->
    <div id="stickerModalWindow" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>😊 Стикеры</h3>
                <span class="close-modal" onclick="closeModal('stickerModalWindow')">&times;</span>
            </div>
            <div style="margin-bottom: 15px;">
                <button onclick="openStickerImageUpload()">📸 Стикер из фото</button>
            </div>
            <div id="stickersGrid" style="display: grid; grid-template-columns: repeat(4,1fr); gap:10px;"></div>
        </div>
    </div>

    <!-- Модалка цвета шрифта -->
    <div id="fontColorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🎨 Цвет шрифта</h3>
                <span class="close-modal" onclick="closeModal('fontColorModal')">&times;</span>
            </div>
            <input type="color" id="fontColorPicker" value="#000000">
            <button onclick="saveFontColor()">Сохранить</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
        // Firebase конфиг
        const firebaseConfig = {
            apiKey: "AIzaSyBfXUgZnRD013c1jPQ04X3ZRRCHJSwE6NQ",
            authDomain: "sny-messenger.firebaseapp.com",
            projectId: "sny-messenger",
            storageBucket: "sny-messenger.firebasestorage.app",
            messagingSenderId: "495989032426",
            appId: "1:495989032426:web:21094d0b3fb3f544579e93"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Переменные
        let currentUser = null;
        let currentChat = null; // { type: 'general' or 'private', userId: id }
        let messagesUnsubscribe = null;
        let chatsUnsubscribe = null;
        let customStickers = [];

        // Переключение табов
        function switchTab(tab) {
            const createTab = document.getElementById('createTab');
            const enterTab = document.getElementById('enterTab');
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (tab === 'create') {
                createTab.classList.add('active');
                enterTab.classList.remove('active');
                btns[0].classList.add('active');
            } else {
                createTab.classList.remove('active');
                enterTab.classList.add('active');
                btns[1].classList.add('active');
            }
        }

        // Загрузка аватарки
        function triggerAvatarUpload() {
            document.getElementById('avatarFile').click();
        }

        document.getElementById('avatarFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('avatarImage').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Создание аккаунта
        async function createAccount() {
            const username = document.getElementById('newUsername').value.trim();
            const fontColor = document.getElementById('fontColorSelect').value;
            if (!username) { alert('Введи никнейм!'); return; }
            
            const snyId = 'SNY_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6).toUpperCase();
            const avatarUrl = document.getElementById('avatarImage').src;
            
            currentUser = {
                id: snyId,
                name: username,
                avatar: avatarUrl,
                fontColor: fontColor,
                theme: 'default',
                createdAt: new Date()
            };
            
            await db.collection('users').doc(snyId).set(currentUser);
            localStorage.setItem('sny_user_id', snyId);
            enterMessenger();
        }

        // Вход
        async function loginWithId() {
            const userId = document.getElementById('existingUserId').value.trim().toUpperCase();
            if (!userId) { alert('Введи SNY-ID!'); return; }
            
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                currentUser = userDoc.data();
                localStorage.setItem('sny_user_id', userId);
                enterMessenger();
            } else {
                alert('Пользователь не найден!');
            }
        }

        // Вход в мессенджер
        async function enterMessenger() {
            document.getElementById('welcomeScreen').classList.remove('active');
            document.getElementById('messengerScreen').style.display = 'block';
            
            document.getElementById('profileName').innerText = currentUser.name;
            document.getElementById('profileAvatar').src = currentUser.avatar;
            document.getElementById('profileId').innerText = currentUser.id;
            
            if (currentUser.theme) changeTheme(currentUser.theme);
            if (currentUser.fontColor) document.documentElement.style.setProperty('--font-color', currentUser.fontColor);
            
            await loadChats();
            loadCustomStickers();
            
            // Открываем общий чат по умолчанию
            openGeneralChat();
        }

        // Загрузка списка чатов
        async function loadChats() {
            if (chatsUnsubscribe) chatsUnsubscribe();
            
            // Получаем всех пользователей
            const usersSnapshot = await db.collection('users').get();
            const users = [];
            usersSnapshot.forEach(doc => {
                if (doc.id !== currentUser.id) {
                    users.push(doc.data());
                }
            });
            
            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = `
                <div class="chat-item" onclick="openGeneralChat()">
                    <div class="chat-avatar" style="background:#667eea; display:flex; align-items:center; justify-content:center; font-size:24px;">💬</div>
                    <div class="chat-info">
                        <div class="chat-name">Общий чат</div>
                        <div class="chat-last-msg">Все пользователи</div>
                    </div>
                </div>
            `;
            
            // Добавляем личные чаты
            users.forEach(user => {
                const chatId = getPrivateChatId(currentUser.id, user.id);
                chatsList.innerHTML += `
                    <div class="chat-item" onclick="openPrivateChat('${user.id}')">
                        <img class="chat-avatar" src="${user.avatar}" alt="">
                        <div class="chat-info">
                            <div class="chat-name">${escapeHtml(user.name)}</div>
                            <div class="chat-last-msg">ID: ${user.id}</div>
                        </div>
                        <button class="copy-id" onclick="copyToClipboard('${user.id}', event)">📋</button>
                    </div>
                `;
            });
        }

        function getPrivateChatId(user1, user2) {
            return [user1, user2].sort().join('_');
        }

        // Открыть общий чат
        function openGeneralChat() {
            currentChat = { type: 'general' };
            document.getElementById('chatHeaderAvatar').src = 'https://via.placeholder.com/40?text=💬';
            document.getElementById('chatHeaderName').innerText = 'Общий чат';
            document.getElementById('chatHeaderId').innerText = 'Все пользователи';
            loadMessages('general');
        }

        // Открыть личный чат
        async function openPrivateChat(userId) {
            const userDoc = await db.collection('users').doc(userId).get();
            const user = userDoc.data();
            currentChat = { type: 'private', userId: userId, userName: user.name, userAvatar: user.avatar };
            document.getElementById('chatHeaderAvatar').src = user.avatar;
            document.getElementById('chatHeaderName').innerText = user.name;
            document.getElementById('chatHeaderId').innerText = userId;
            loadMessages('private', userId);
        }

        // Загрузка сообщений
        function loadMessages(chatType, otherUserId = null) {
            if (messagesUnsubscribe) messagesUnsubscribe();
            
            let query;
            if (chatType === 'general') {
                query = db.collection('messages').where('chatType', '==', 'general').orderBy('timestamp', 'asc');
            } else {
                const chatId = getPrivateChatId(currentUser.id, otherUserId);
                query = db.collection('messages').where('chatId', '==', chatId).orderBy('timestamp', 'asc');
            }
            
            messagesUnsubscribe = query.onSnapshot((snapshot) => {
                const container = document.getElementById('messagesList');
                container.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    msg.id = doc.id;
                    displayMessage(msg);
                });
                
                container.scrollTop = container.scrollHeight;
            });
        }

        // Отображение сообщения
        function displayMessage(msg) {
            const container = document.getElementById('messagesList');
            const div = document.createElement('div');
            const isOwn = msg.userId === currentUser.id;
            div.className = 'message ' + (isOwn ? 'message-own' : 'message-other');
            
            const time = msg.timestamp?.toDate ? new Date(msg.timestamp.toDate()).toLocaleTimeString() : '';
            
            // Получаем цвет шрифта отправителя
            const senderColor = msg.fontColor || '#000000';
            
            let content = '';
            if (msg.type === 'text') {
                content = `<div class="message-text" style="color: ${senderColor}">${escapeHtml(msg.text)}</div>`;
            } else if (msg.type === 'image') {
                content = `<img src="${msg.imageUrl}" class="message-image" onclick="viewImage('${msg.imageUrl}')">`;
            } else if (msg.type === 'video') {
                content = `<video src="${msg.videoUrl}" controls class="message-video"></video>`;
            } else if (msg.type === 'sticker') {
                if (msg.stickerUrl) {
                    content = `<img src="${msg.stickerUrl}" class="custom-sticker" style="width:80px">`;
                } else {
                    content = `<div class="message-sticker">${msg.sticker}</div>`;
                }
            }
            
            // Реакции
            let reactionsHtml = '';
            if (msg.reactions) {
                const reactionList = Object.entries(msg.reactions);
                if (reactionList.length > 0) {
                    reactionsHtml = '<div class="reactions">';
                    reactionList.forEach(([emoji, users]) => {
                        reactionsHtml += `<span class="reaction" onclick="addReaction('${msg.id}', '${emoji}')">
                            <span class="reaction-emoji">${emoji}</span> ${users.length}
                        </span>`;
                    });
                    reactionsHtml += '</div>';
                }
            }
            
            // Просмотры
            let viewsHtml = '';
            if (!isOwn && msg.views && !msg.views.includes(currentUser.id)) {
                setTimeout(() => markAsViewed(msg.id), 1000);
            }
            if (msg.views && msg.views.length > 0) {
                viewsHtml = `<div class="views-info" onclick="showViews('${msg.id}')">👁️ ${msg.views.length} просмотров</div>`;
            }
            
            div.innerHTML = `
                <div class="message-bubble">
                    <div class="message-name">${escapeHtml(msg.userName)}</div>
                    ${content}
                    ${reactionsHtml}
                    ${viewsHtml}
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            container.appendChild(div);
        }

        // Отметка о просмотре
        async function markAsViewed(messageId) {
            const msgRef = db.collection('messages').doc(messageId);
            const msgDoc = await msgRef.get();
            const msg = msgDoc.data();
            if (msg && msg.views) {
                if (!msg.views.includes(currentUser.id)) {
                    await msgRef.update({
                        views: [...msg.views, currentUser.id]
                    });
                }
            } else if (msg) {
                await msgRef.update({
                    views: [currentUser.id]
                });
            }
        }

        // Показать просмотры
        async function showViews(messageId) {
            const msgDoc = await db.collection('messages').doc(messageId).get();
            const msg = msgDoc.data();
            if (msg && msg.views) {
                const viewsList = document.getElementById('viewsList');
                viewsList.innerHTML = '';
                for (const userId of msg.views) {
                    const userDoc = await db.collection('users').doc(userId).get();
                    if (userDoc.exists) {
                        const user = userDoc.data();
                        viewsList.innerHTML += `
                            <div style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #eee;">
                                <img src="${user.avatar}" style="width:40px; height:40px; border-radius:50%;">
                                <div>
                                    <div><strong>${escapeHtml(user.name)}</strong></div>
                                    <small>${user.id}</small>
                                </div>
                            </div>
                        `;
                    }
                }
                document.getElementById('viewsModal').classList.add('active');
            }
        }

        // Добавить реакцию
        async function addReaction(messageId, emoji) {
            const msgRef = db.collection('messages').doc(messageId);
            const msgDoc = await msgRef.get();
            const msg = msgDoc.data();
            let reactions = msg.reactions || {};
            if (!reactions[emoji]) reactions[emoji] = [];
            if (!reactions[emoji].includes(currentUser.id)) {
                reactions[emoji].push(currentUser.id);
                await msgRef.update({ reactions });
            }
        }

        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            const messageData = {
                type: 'text',
                text: text,
                userId: currentUser.id,
                userName: currentUser.name,
                avatar: currentUser.avatar,
                fontColor: currentUser.fontColor,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                views: [],
                reactions: {}
            };
            
            if (currentChat.type === 'general') {
                messageData.chatType = 'general';
            } else {
                messageData.chatType = 'private';
                messageData.chatId = getPrivateChatId(currentUser.id, currentChat.userId);
                messageData.recipientId = currentChat.userId;
            }
            
            await db.collection('messages').add(messageData);
            input.value = '';
        }

        // Отправка фото
        function attachImage() {
            document.getElementById('imageInput').click();
        }

        document.getElementById('imageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                const messageData = {
                    type: 'image',
                    imageUrl: event.target.result,
                    userId: currentUser.id,
                    userName: currentUser.name,
                    avatar: currentUser.avatar,
                    fontColor: currentUser.fontColor,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    views: [],
                    reactions: {}
                };
                
                if (currentChat.type === 'general') {
                    messageData.chatType = 'general';
                } else {
                    messageData.chatType = 'private';
                    messageData.chatId = getPrivateChatId(currentUser.id, currentChat.userId);
                    messageData.recipientId = currentChat.userId;
                }
                
                await db.collection('messages').add(messageData);
            };
            reader.readAsDataURL(file);
            document.getElementById('imageInput').value = '';
        });

        // Отправка видео
        function attachVideo() {
            document.getElementById('videoFile').click();
        }

        document.getElementById('videoFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                const messageData = {
                    type: 'video',
                    videoUrl: event.target.result,
                    userId: currentUser.id,
                    userName: currentUser.name,
                    avatar: currentUser.avatar,
                    fontColor: currentUser.fontColor,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    views: [],
                    reactions: {}
                };
                
                if (currentChat.type === 'general') {
                    messageData.chatType = 'general';
                } else {
                    messageData.chatType = 'private';
                    messageData.chatId = getPrivateChatId(currentUser.id, currentChat.userId);
                    messageData.recipientId = currentChat.userId;
                }
                
                await db.collection('messages').add(messageData);
            };
            reader.readAsDataURL(file);
            document.getElementById('videoFile').value = '';
        });

        // Стикеры
        async function loadCustomStickers() {
            const stickersRef = await db.collection('stickers').where('userId', '==', currentUser.id).get();
            customStickers = [];
            stickersRef.forEach(doc => {
                customStickers.push(doc.data());
            });
            renderStickers();
        }

        function renderStickers() {
            const grid = document.getElementById('stickersGrid');
            grid.innerHTML = '';
            
            const defaultStickers = ['😊', '😂', '🥰', '😎', '🎉', '❤️', '🔥', '💯'];
            defaultStickers.forEach(sticker => {
                const div = document.createElement('div');
                div.className = 'sticker-item';
                div.textContent = sticker;
                div.style.fontSize = '40px';
                div.style.cursor = 'pointer';
                div.onclick = () => sendSticker(sticker);
                grid.appendChild(div);
            });
            
            customStickers.forEach(sticker => {
                const div = document.createElement('div');
                div.className = 'sticker-item';
                if (sticker.stickerUrl) {
                    div.innerHTML = `<img src="${sticker.stickerUrl}" style="width:50px; height:50px; object-fit:contain;">`;
                } else {
                    div.textContent = sticker.sticker;
                }
                div.style.cursor = 'pointer';
                div.onclick = () => sendSticker(sticker.sticker || sticker.stickerUrl, sticker.stickerUrl);
                grid.appendChild(div);
            });
        }

        async function sendSticker(sticker, stickerUrl = null) {
            const messageData = {
                type: 'sticker',
                sticker: sticker,
                stickerUrl: stickerUrl,
                userId: currentUser.id,
                userName: currentUser.name,
                avatar: currentUser.avatar,
                fontColor: currentUser.fontColor,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                views: [],
                reactions: {}
            };
            
            if (currentChat.type === 'general') {
                messageData.chatType = 'general';
            } else {
                messageData.chatType = 'private';
                messageData.chatId = getPrivateChatId(currentUser.id, currentChat.userId);
                messageData.recipientId = currentChat.userId;
            }
            
            await db.collection('messages').add(messageData);
            closeModal('stickerModalWindow');
        }

        function openStickerModal() {
            document.getElementById('stickerModalWindow').classList.add('active');
        }

        function openStickerImageUpload() {
            document.getElementById('stickerImageInput').click();
        }

        document.getElementById('stickerImageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                await db.collection('stickers').add({
                    userId: currentUser.id,
                    stickerUrl: event.target.result,
                    createdAt: new Date()
                });
                await loadCustomStickers();
            };
            reader.readAsDataURL(file);
        });

        // Профиль
        async function showProfile(userId) {
            const userDoc = await db.collection('users').doc(userId).get();
            const user = userDoc.data();
            const content = document.getElementById('profileContent');
            content.innerHTML = `
                <div class="profile-view">
                    <img src="${user.avatar}" class="profile-view-avatar">
                    <h3>${escapeHtml(user.name)}</h3>
                    <p style="color:#666; margin:10px 0;">ID: ${user.id}</p>
                    <button onclick="copyToClipboard('${user.id}')">📋 Копировать ID</button>
                    ${userId !== currentUser.id ? `<button onclick="openPrivateChat('${userId}'); closeModal('profileModal');">💬 Написать</button>` : ''}
                </div>
            `;
            document.getElementById('profileModal').classList.add('active');
        }

        // Копирование ID
        function copyToClipboard(text, event) {
            if (event) event.stopPropagation();
            navigator.clipboard.writeText(text);
            alert('✅ ID скопирован!');
        }

        // Темы
        function showThemeModal() {
            document.getElementById('themeModal').classList.add('active');
        }

        function changeTheme(theme) {
            document.body.className = `theme-${theme}`;
            if (currentUser) {
                db.collection('users').doc(currentUser.id).update({ theme });
                currentUser.theme = theme;
            }
        }

        // Цвет шрифта
        function showFontColorModal() {
            document.getElementById('fontColorModal').classList.add('active');
        }

        async function saveFontColor() {
            const color = document.getElementById('fontColorPicker').value;
            await db.collection('users').doc(currentUser.id).update({ fontColor: color });
            currentUser.fontColor = color;
            document.documentElement.style.setProperty('--font-color', color);
            closeModal('fontColorModal');
            alert('✅ Цвет шрифта сохранен!');
        }

        // Просмотр фото
        function viewImage(imageUrl) {
            window.open(imageUrl, '_blank');
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Закрытие модалок по клику вне
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }

        // Выход
        function logout() {
            if (confirm('Выйти?')) {
                localStorage.removeItem('sny_user_id');
                if (messagesUnsubscribe) messagesUnsubscribe();
                if (chatsUnsubscribe) chatsUnsubscribe();
                document.getElementById('welcomeScreen').classList.add('active');
                document.getElementById('messengerScreen').style.display = 'none';
            }
        }

        // Проверка сохраненного пользователя
        async function checkSavedUser() {
            const saved = localStorage.getItem('sny_user_id');
            if (saved) {
                const userDoc = await db.collection('users').doc(saved).get();
                if (userDoc.exists) {
                    currentUser = userDoc.data();
                    enterMessenger();
                }
            }
        }

        checkSavedUser();
    </script>
</body>
</html>
